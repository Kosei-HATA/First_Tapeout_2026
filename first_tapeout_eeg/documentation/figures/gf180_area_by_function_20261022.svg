<title id="t">チップ面積の機能別の内訳（2026-10-22 の見積もり）</title>
<desc id="d">ダイ 9.95 mm2 のうちパッドリングが 4.93 mm2。コア 5.02 mm2 は AFE 1.62、ADC 1.50、支援回路 0.41、デジタル 0.33、配線 0.81、予備 0.35 mm2（中央値）。</desc>
