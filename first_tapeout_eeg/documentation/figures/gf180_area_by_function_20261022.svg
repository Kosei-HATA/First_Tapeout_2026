<text class="s" x="40" y="60" font-size="12.5">2026-10-22 の見積もり（各項目の下限と上限の中央値）。ダイ 3932 × 2531 µm = 9.95 mm²、コア 3048 × 1647 µm = 5.02 mm²。</text>
<text class="s" x="40" y="78" font-size="12.5">10/21 の面積見積もりに、10/22 の変更（AFE の構成、出力の保持容量、DAC2 の MOS 電流 DAC）を反映。配線とブロック間は +15〜25 %。</text>
