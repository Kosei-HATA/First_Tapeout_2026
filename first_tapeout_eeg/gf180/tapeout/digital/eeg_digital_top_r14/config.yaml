# LibreLane (v3, Classic flow) hard macro: eeg_digital_top r14 (gf180/tapeout/rtl_r14/): the new digital control
# (sequencer, registers with shadow and active copies, SPI, FIFO, overload detection; the same ports as the r13 macro).
# Outline 440 x 900 um: the user's decision "Yes, 440 x 900" (11/19) after the area trial (README_trial_20261119.md:
# 440 x 700 um does not place, 92 % utilization). In the chip like the r13 macro, in the east digital column of the
# core, with the DVDD decoupling above it moved 200 um up.
# Settings of the r13 macro (../eeg_digital_top/config.yaml: 9-track library, 3.3 V corners, SDC, pin order, PDN,
# excluded cells), plus, so that the macro finishes without design-rule warnings:
#   - the design repair after global routing (the trial's reset tree reached a 4.76 ns slew once routed, limit 3 ns);
#   - clock-tree clusters of at most 10 sinks and 0.2 pF (the SDC's max fanout and max capacitance; the r13 macro's
#     clock leaf buffers drive 22 sinks and its root buffers up to 0.5 pF);
#   - a placement target density above the utilization (GPL-0302 with 55 %);
#   - TIMESCALEMOD off for the PDK cells' blackbox stubs only (they carry no `timescale; the RTL lints clean with
#     Verilator -Wall).
# Run with run_r14_macro.sh from a Terminal panel tab.
meta:
  version: 3
  flow: Classic

DESIGN_NAME: eeg_digital_top
VERILOG_FILES:
- dir::../../rtl_r14/eeg_digital_top.sv
- dir::../../rtl_r14/eeg_seq.sv
- dir::../../rtl_r14/eeg_regs.sv
- dir::../../rtl_r14/eeg_spi_slave.sv
- dir::../../rtl_r14/eeg_fifo.sv
- dir::../../rtl_r14/eeg_ovl.sv
- dir::../../rtl_r14/eeg_cic3.sv
- dir::../../rtl_r14/eeg_clkgen.sv
- dir::../../rtl/eeg_chop1.sv
- dir::../../rtl/eeg_rnd_sat.sv
- dir::../../rtl/eeg_raw.sv
VERILOG_INCLUDE_DIRS:
- dir::../../rtl/spec
USE_SLANG: true
LINTER_DISABLE_WARNINGS_BLACKBOX: [UNDRIVEN, UNUSEDSIGNAL, TIMESCALEMOD]

CLOCK_PORT: MCLK
CLOCK_PERIOD: 30.5          # 32.768 MHz

FP_SIZING: absolute
DIE_AREA: [0, 0, 440, 900]
PL_TARGET_DENSITY_PCT: 80
FP_PIN_ORDER_CFG: dir::../eeg_digital_top/pin_order.cfg

VDD_NETS: [VDD]
GND_NETS: [VSS]
PDN_MULTILAYER: false
PDN_VPITCH: 40
PDN_VWIDTH: 3

RT_MAX_LAYER: Metal4

PNR_SDC_FILE: dir::../eeg_digital_top/eeg_digital_top.sdc
SIGNOFF_SDC_FILE: dir::../eeg_digital_top/eeg_digital_top.sdc
CELL_LIBS:
  "*_tt_025C_3v30":
  - pdk_dir::libs.ref/gf180mcu_fd_sc_mcu9t5v0/lib/gf180mcu_fd_sc_mcu9t5v0__tt_025C_3v30.lib
  "*_ss_125C_3v00":
  - pdk_dir::libs.ref/gf180mcu_fd_sc_mcu9t5v0/lib/gf180mcu_fd_sc_mcu9t5v0__ss_125C_3v00.lib
  "*_ff_n40C_3v60":
  - pdk_dir::libs.ref/gf180mcu_fd_sc_mcu9t5v0/lib/gf180mcu_fd_sc_mcu9t5v0__ff_n40C_3v60.lib
STA_CORNERS:
- nom_tt_025C_3v30
- nom_ss_125C_3v00
- nom_ff_n40C_3v60
- min_tt_025C_3v30
- min_ss_125C_3v00
- min_ff_n40C_3v60
- max_tt_025C_3v30
- max_ss_125C_3v00
- max_ff_n40C_3v60
DEFAULT_CORNER: nom_tt_025C_3v30

CTS_SINK_CLUSTERING_SIZE: 10
CTS_MAX_CAP: 0.2

RUN_POST_GRT_RESIZER_TIMING: true
RUN_POST_GRT_DESIGN_REPAIR: true
EXTRA_EXCLUDED_CELLS:
- gf180mcu_fd_sc_mcu9t5v0__xnor3_4
- gf180mcu_fd_sc_mcu9t5v0__dffrnq_4
- gf180mcu_fd_sc_mcu9t5v0__dly*
